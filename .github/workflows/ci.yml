name: CI

# Corre en cada push y PR a main/master. Cancela runs viejos del mismo PR.
on:
  # Corre en cada push a cualquier branch para feedback temprano en features.
  # Para PRs corre también — útil cuando un fork abre PR sin push directo.
  push:
    branches-ignore: ['backup/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + bundle check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` falla si lockfile y package.json divergen — exacto lo que
        # querés en CI. Más rápido que `npm install` y deterministic.
        run: npm ci

      - name: Build production bundle
        # Vite transforma TypeScript con esbuild durante el build. Si hay un
        # error sintáctico o un import roto, el build falla. Para typecheck
        # estricto (errores de tipo sin uso) habría que agregar `tsc --noEmit`
        # como devDependency — queda como mejora futura.
        # Vars VITE_* son inyectadas en build time. Para CI usamos placeholders
        # que solo importan para que la build no se queje.
        env:
          VITE_API_BASE_URL: '/api'
          VITE_CLERK_PUBLISHABLE_KEY: 'pk_test_ci_dummy'
        run: npm run build

      - name: Verify bundle was produced
        # Smoke check: si dist no existe o está vacío, algo falló sin tirar
        # error. Útil cuando vite cambia el comportamiento de error.
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::dist/ está vacío después del build"
            exit 1
          fi
          ls -lh dist/assets/ | head -20

      - name: Upload dist artifact
        # Permite descargar el bundle desde la UI de GitHub Actions para
        # debugging o despliegues manuales.
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high
