# nginx que sirve el portal ya compilado, dentro del contenedor del frontend.
# El nginx de afuera (el del repo de infra) es el que termina TLS y reparte
# entre este y el backend; este sólo entrega archivos.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite le pone un hash al nombre de cada archivo de /assets, así que el
  # contenido de una URL nunca cambia: se puede cachear para siempre. Cuando
  # sale una versión nueva, cambian los nombres y el navegador los pide solos.
  location /assets/ {
    # Un solo Cache-Control: `expires` emite el suyo y terminaban saliendo dos
    # headers para lo mismo.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # El index NO se cachea: es el que apunta a los assets nuevos. Si el navegador
  # se queda con uno viejo, sigue pidiendo archivos que ya no existen y el
  # portal queda en blanco después de cada deploy.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # El portal usa BrowserRouter: /tarjetas o /ingresar no son carpetas, son
  # rutas que resuelve React. Cualquier cosa que no sea un archivo real devuelve
  # el index y el router decide qué mostrar.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Este nginx no se expone: quien pregunte por la versión que lo haga al de
  # adelante.
  server_tokens off;
}
